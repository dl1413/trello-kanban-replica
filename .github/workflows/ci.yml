name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      
      - name: Lint with flake8
        run: |
          flake8 environments/ examples/ tests/ tools/ --max-line-length=120 --statistics
      
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=environments --cov=examples --cov-report=xml --cov-report=term-missing
      
      - name: Type check with mypy (optional, non-blocking)
        run: |
          pip install mypy
          mypy environments/ --ignore-missing-imports || true
  
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install black flake8
      
      - name: Check formatting
        run: black --check environments/ examples/ tests/ tools/
      
      - name: Lint
        run: flake8 environments/ examples/ tests/ tools/ --max-line-length=120
