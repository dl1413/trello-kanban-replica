[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-environment-framework"
version = "1.0.0"
description = "A comprehensive framework for developing reinforcement learning environments"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Verita AI", email = "info@verita.ai"}
]
keywords = ["reinforcement-learning", "gymnasium", "rl", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "gymnasium==0.29.1",
    "numpy==1.24.4",
    "pyyaml==6.0.1",
    "matplotlib==3.7.5",
    "pandas==2.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-cov==4.1.0",
    "black==23.12.1",
    "flake8==7.0.0",
    "mypy==1.8.0",
    "pre-commit>=3.0.0",
    "isort>=5.12.0",
]
viz = [
    "opencv-python==4.8.1.78",
]
monitoring = [
    "tensorboard==2.13.0",
    # wandb excluded due to SSRF vulnerability (CVE advisory for versions <= 0.17.0)
    # Install separately if needed: pip install "wandb>=0.18.0"
]

[project.urls]
Homepage = "https://github.com/YOUR_ORG/rl-environment-framework"
Documentation = "https://github.com/YOUR_ORG/rl-environment-framework/tree/main/docs"
Repository = "https://github.com/YOUR_ORG/rl-environment-framework"
Issues = "https://github.com/YOUR_ORG/rl-environment-framework/issues"

[tool.black]
line-length = 127
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | _build
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 127
multi_line_output = 3
include_trailing_comma = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]  # Skip assert warnings in tests

[tool.coverage.run]
source = ["environments", "examples"]
omit = ["tests/*", "setup.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
