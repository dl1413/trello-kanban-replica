# Default environment configuration
# This file contains default settings for RL environments

environment:
  # Episode configuration
  episode_length: 1000
  max_steps: 10000
  
  # Observation space
  observation:
    type: "image"  # image, vector, dict
    shape: [84, 84, 3]
    normalize: true
    
  # Action space
  action:
    type: "discrete"  # discrete, continuous, multi_discrete
    n_actions: 4
    
  # Reward configuration
  reward:
    scale: 1.0
    clip: true
    clip_range: [-10, 10]
    
  # Rendering
  render:
    mode: "rgb_array"
    fps: 30
    width: 640
    height: 480

# Training configuration
training:
  seed: 42
  num_episodes: 1000
  parallel_envs: 8
  
# Logging and monitoring
logging:
  tensorboard: true
  wandb: false
  log_interval: 10
  save_interval: 100
