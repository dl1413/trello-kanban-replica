# Example custom environment configuration
# Override default settings for specific use cases

environment:
  episode_length: 2000
  max_steps: 20000
  
  observation:
    type: "vector"
    shape: [128]
    normalize: true
    
  action:
    type: "continuous"
    shape: [4]
    low: [-1.0, -1.0, -1.0, -1.0]
    high: [1.0, 1.0, 1.0, 1.0]
    
  reward:
    scale: 0.1
    sparse: false
    shaped: true
    
training:
  seed: 123
  num_episodes: 5000
  parallel_envs: 16
  
logging:
  tensorboard: true
  wandb: true
  experiment_name: "custom_env_v1"
  log_interval: 5
