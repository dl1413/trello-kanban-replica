# Medium Configuration - Moderate grid size with some obstacles
# Standard difficulty for typical training

environment:
  grid_size: 10
  episode_length: 100
  reward_type: 'sparse'
  randomize_goal: true
  num_obstacles: 5
  
  reward:
    scale: 1.0
    clip: true
    clip_range: [-10, 10]

agent:
  learning_rate: 0.1
  learning_rate_decay: 0.001
  learning_rate_min: 0.01
  discount_factor: 0.95
  epsilon: 1.0
  epsilon_decay: 0.995
  epsilon_min: 0.01
  exploration_strategy: 'epsilon_greedy'
  temperature: 1.0
  use_double_q: false

training:
  seed: 42
  num_episodes: 1000
  eval_interval: 50
  max_steps: 100
